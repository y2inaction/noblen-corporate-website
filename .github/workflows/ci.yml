name: CI

# Dependencies come only from official sources: Packagist (Composer), the npm registry,
# wordpress.org (pinned WordPress release), the Playwright browser CDN and GitHub Actions.
# Nothing is vendored. No secrets are used. Not pushed or run until the owner approves.

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

env:
  WP_VERSION: '6.4.3'

jobs:
  static:
    name: Static analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - name: Install dev tooling
        run: composer install --no-interaction --prefer-dist
      - name: PHP lint (C16-001, C16-002)
        run: find wordpress-theme wordpress-plugin tests-e2e scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPCS, WordPress standards (C16-003, C16-004)
        run: vendor/bin/phpcs
      - name: PHP compatibility 8.3 and 8.4 (C16-005)
        run: |
          vendor/bin/phpcs -q --standard=PHPCompatibility --runtime-set testVersion 8.3- --extensions=php --ignore='*/tests/*' wordpress-theme wordpress-plugin
          vendor/bin/phpcs -q --standard=PHPCompatibility --runtime-set testVersion 8.4- --extensions=php --ignore='*/tests/*' wordpress-theme wordpress-plugin
      - name: No third-party hosts in sources (C18-002)
        run: scripts/check-no-third-party.sh

  php85-informational:
    name: PHP 8.5 compatibility (informational, C16-006)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
      - run: composer install --no-interaction --prefer-dist --ignore-platform-req=php
      - run: find wordpress-theme wordpress-plugin -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: vendor/bin/phpcs -q --standard=PHPCompatibility --runtime-set testVersion 8.5- --extensions=php --ignore='*/tests/*' wordpress-theme wordpress-plugin

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, MySQL 8.4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: noblen_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd, mbstring
          tools: phpunit:9.6
      - name: Disposable WordPress ${{ env.WP_VERSION }}
        env:
          WP_DIR: ${{ runner.temp }}/wp
        run: scripts/ci-setup-wordpress.sh
      - name: PHPUnit
        working-directory: wordpress-plugin/noblen-corporate-core/tests
        env:
          NOBLEN_WP_PATH: ${{ runner.temp }}/wp
        run: phpunit -c phpunit.xml.dist --log-junit "$RUNNER_TEMP/junit-${{ matrix.php }}.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-php${{ matrix.php }}
          path: ${{ runner.temp }}/junit-${{ matrix.php }}.xml

  wpcli:
    name: WP-CLI integration and package install (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd, mbstring
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - name: Fetch WordPress core
        env:
          WP_DIR: ${{ runner.temp }}/wp
        run: |
          mkdir -p "$WP_DIR"
          curl -fsSL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" | tar -xz --strip-components=1 -C "$WP_DIR"
          cat > "$WP_DIR/wp-config.php" <<'PHP'
          <?php
          define( 'DB_NAME', getenv( 'NOBLEN_DB_NAME' ) ); define( 'DB_USER', 'root' ); define( 'DB_PASSWORD', 'root' );
          define( 'DB_HOST', '127.0.0.1' ); define( 'DB_CHARSET', 'utf8mb4' ); define( 'DB_COLLATE', '' );
          foreach ( array( 'AUTH_KEY','SECURE_AUTH_KEY','LOGGED_IN_KEY','NONCE_KEY','AUTH_SALT','SECURE_AUTH_SALT','LOGGED_IN_SALT','NONCE_SALT' ) as $k ) { define( $k, 'ci-only-' . $k ); }
          $table_prefix = 'wp_';
          define( 'NOBLEN_AUDIT_KEYS', array( 'ci1' => 'ci-only-throwaway-key-0123456789abcdef' ) ); define( 'NOBLEN_AUDIT_KEY_ID', 'ci1' );
          define( 'WP_DEBUG', true ); define( 'WP_DEBUG_DISPLAY', false ); define( 'WP_DEBUG_LOG', getenv( 'WP_DEBUG_LOG_FILE' ) ? getenv( 'WP_DEBUG_LOG_FILE' ) : false );
          define( 'WP_HTTP_BLOCK_EXTERNAL', true ); define( 'DISABLE_WP_CRON', true );
          if ( ! defined( 'ABSPATH' ) ) { define( 'ABSPATH', __DIR__ . '/' ); }
          require_once ABSPATH . 'wp-settings.php';
          PHP
      - name: Databases
        run: |
          sudo apt-get install -y -qq mysql-client >/dev/null
          for d in noblen_cli noblen_pkg; do mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE $d CHARACTER SET utf8mb4"; done
      - name: WP-CLI integration (C01, C02, C04, C24, C26)
        env:
          NOBLEN_DB_NAME: noblen_cli
          WP: ${{ github.workspace }}/vendor/bin/wp
          WP_PATH: ${{ runner.temp }}/wp
          WP_DEBUG_LOG_FILE: ${{ runner.temp }}/cli-debug.log
        run: tests-cli/cli-integration.sh
      - name: Package build and clean install (C19)
        env:
          NOBLEN_DB_NAME: noblen_pkg
          WP: ${{ github.workspace }}/vendor/bin/wp
          WP_SRC: ${{ runner.temp }}/wp
        run: tests-cli/package-install.sh

  browser:
    name: Browser, admin workflow and accessibility
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: noblen_e2e
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NOBLEN_DB_NAME: noblen_e2e
      BASE_URL: http://127.0.0.1:8100
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, gd, mbstring
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - name: Disposable WordPress
        env:
          WP_DIR: ${{ runner.temp }}/wp
        run: scripts/ci-setup-wordpress.sh
      - name: Activate, seed, serve
        env:
          WP_DIR: ${{ runner.temp }}/wp
        run: |
          W="vendor/bin/wp --path=$WP_DIR"
          $W option update home "$BASE_URL" && $W option update siteurl "$BASE_URL"
          $W plugin activate noblen-corporate-core && $W theme activate noblen-corporate
          $W rewrite structure '/%postname%/' --hard
          $W eval-file tests-e2e/seed-e2e.php
          PHP_CLI_SERVER_WORKERS=4 nohup php -S 127.0.0.1:8100 -t "$WP_DIR" > "$RUNNER_TEMP/php-server.log" 2>&1 &
          sleep 3; curl -fsS "$BASE_URL/" >/dev/null
      - name: Install browser tooling
        working-directory: tests-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Front-end smoke at 360, 768, 1280 px (C13, C18-001, C12-001)
        working-directory: tests-e2e
        run: mkdir -p "$RUNNER_TEMP/shots" && node smoke.js "$RUNNER_TEMP/shots"
      - name: WordPress admin workflow (C06, C09, C10, C24 in a real browser)
        working-directory: tests-e2e
        env:
          CLEAR_LOCKS_CMD: 'mysql -h127.0.0.1 -uroot -proot -e "DELETE FROM noblen_e2e.wp_postmeta WHERE meta_key=''_edit_lock''"'
        run: node admin.js
      - name: 'Accessibility: axe, contrast, keyboard (C14, C15)'
        working-directory: tests-e2e
        run: node a11y.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots

  packages:
    name: Package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-packages.sh "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/dist
